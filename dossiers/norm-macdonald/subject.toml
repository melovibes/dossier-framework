# Subject config. Edit this first; everything else is generated from it.
[subject]
name = "Norm Macdonald"
slug = "norm-macdonald"
aliases = ["Norman Gene Macdonald", "Norm MacDonald"]                 # other names, spellings, titles
kind = "person"              # person | event | place | object | movement | topic
period = "1959-2021"                  # e.g. "c. 30 BCE - 36 CE" or "1840-1865"
region = "Canada; United States"
research_cutoff = "2026-10-27"

[scope]
in_scope = ["public career: stand-up, SNL, film, TV, podcast, books, specials", "birth-year dispute", "publicly reported illness and death", "published personal history: parents, marriage, son, residences by city", "published controversies, gambling and faith as he described them"]                # what the dossier covers
out_of_scope = ["street addresses or contact details", "private details of living relatives beyond names and published basics", "unverified fan claims and rumors"]            # what it deliberately does not
# Confirm before starting: the subject is historical or a public figure/topic,
# and research uses published sources only (see ETHICS.md).
public_subject_confirmed = true   # public figure, died 2021

[questions]
# Research questions; each becomes a chapter seed in dossier/.
list = [
  "When was he born: 1959 or 1963?",
  "Early life and the stand-up start",
  "SNL, Weekend Update and the 1998 removal",
  "Films and TV: Dirty Work, The Norm Show and after",
  "The moth joke and the talk-show legacy",
  "Norm Macdonald Live and Nothing Special",
  "Based on a True Story: a memoir that is partly fiction",
  "Illness and death",
  "Legacy and posthumous recognition",
  "Personal life and family",
  "Gambling and poker",
  "The 2018 #MeToo comments",
  "Faith",
]

[collections]
# Folders under collections/ for mirrored public-domain sources.
list = ["public-domain"]
