# Weekly external link-rot check. Copy to .github/workflows/ (needs a token with the `workflow` scope to push).
name: linkrot
on:
  schedule: [{cron: "17 6 * * 1"}]   # Mondays 06:17 UTC
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  linkrot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check source urls
        id: check
        run: python tools/check_links.py --external --report linkrot.md
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: {name: linkrot, path: linkrot.md}
      - name: Open an issue when sources are dead
        if: steps.check.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh issue create --title "Link rot: dead source urls ($(date -u +%F))" --body-file linkrot.md
